plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.savevideo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.savevideo.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // yt-dlp ships native (Python) libraries only for these ABIs.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Required by youtubedl-android: native libs must be extracted, not compressed.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
                'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // yt-dlp engine for Android (maintained fork used by the Seal app)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    // ffmpeg with a scriptable API, used to stitch photo-slideshow posts
    // (images + music) into a single video. Maintained, 16KB-page-ready fork.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.9'
}
